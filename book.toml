[book]
title = "The Technique of My Musical Language"
authors = ["Olivier Messiaen", "Translated by John Satterfield"]
description = "A searchable digital edition of Messiaen's treatise on his compositional techniques"
language = "en"

[output.html]
no-section-label = true
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/yourusername/messiaen-technique"
edit-url-template = "https://github.com/yourusername/messiaen-technique/edit/main/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-hierarchical-urls = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[output.html.fold]
enable = true
level = 0
